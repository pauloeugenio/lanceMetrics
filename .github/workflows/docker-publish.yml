name: Docker publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Serialize publications for a ref so an older build cannot overwrite latest.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: lancemetrics

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate deployment launchers
        run: |
          for script in lanceMetrics bare-metal/*.sh bare-metal/lanceMetrics docker/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s docker/tests -v
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build local validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: lancemetrics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate HTTP, frontend, tools and shutdown without publishing
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f lance-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name lance-ci --cap-drop ALL --security-opt no-new-privileges:true lancemetrics:ci
          for attempt in $(seq 1 60); do
            if docker exec lance-ci python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2).status == 200"; then
              break
            fi
            sleep 1
          done
          docker exec lance-ci python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2).status == 200; assert b'<html' in urllib.request.urlopen('http://127.0.0.1:8080/').read().lower()"
          docker exec lance-ci ./lanceMetrics diagnostics
          docker run --rm --entrypoint python -v "$PWD:/workspace:ro" -w /workspace/bare-metal lancemetrics:ci -m pytest backend/tests -q -p no:cacheprovider
          docker exec lance-ci ./stop.sh
          timeout 60 docker wait lance-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' lance-ci)" = 0
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
