services:
  lancemetrics:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/${IMAGE_NAME:-lancemetrics}:${IMAGE_TAG:-latest}
    # Explicit restart preserves the application's intentional web stop button.
    restart: "no"
    stop_grace_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LANCE_BIND: 0.0.0.0
      LANCE_PORT: "8080"
      LANCE_VIDEO_MAX_BYTES: ${LANCE_VIDEO_MAX_BYTES:-2147483648}
      LANCE_VIDEO_LIBRARY_BYTES: ${LANCE_VIDEO_LIBRARY_BYTES:-53687091200}
    ports:
      - "8080:8080/tcp"
      - "5201:5201/tcp"
      - "5201:5201/udp"
      - "5000:5000/udp"
    volumes:
      - lance-data:/app/data
      - lance-logs:/app/logs
      - lance-run:/app/run

volumes:
  lance-data:
  lance-logs:
  lance-run:
