services:
  lancemetrics:
    image: ${LANCE_IMAGE:-lancemetrics:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Explicit restart preserves the application's intentional web stop button.
    restart: "no"
    stop_grace_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LANCE_AUTH_ENABLED: ${LANCE_AUTH_ENABLED:-false}
      LANCE_BIND: 0.0.0.0
      LANCE_PORT: "8080"
      LANCE_VIDEO_MAX_BYTES: ${LANCE_VIDEO_MAX_BYTES:-2147483648}
      LANCE_VIDEO_LIBRARY_BYTES: ${LANCE_VIDEO_LIBRARY_BYTES:-53687091200}
    ports:
      - "${LANCE_HTTP_PORT:-8080}:8080/tcp"
      - "${LANCE_IPERF_PORT:-5201}:${LANCE_IPERF_PORT:-5201}/tcp"
      - "${LANCE_IPERF_PORT:-5201}:${LANCE_IPERF_PORT:-5201}/udp"
      - "${LANCE_VIDEO_PORT_RANGE:-5000-5018}:${LANCE_VIDEO_PORT_RANGE:-5000-5018}/udp"
    volumes:
      - lance-data:/app/data
      - lance-logs:/app/logs
      - lance-run:/app/run

volumes:
  lance-data:
  lance-logs:
  lance-run:
